// Vendored subset of google/protobuf/compiler/codegen_request.proto.
//
// protoc emits a full CodeGeneratorRequest on the plugin's stdin. We only
// need the fields chattolib's protoc plugin reads, so this is a trimmed copy.
// protoc tolerates the subset: it still serializes the complete request, and
// we parse only what we need. Field numbers match the canonical proto so the
// wire format lines up.
syntax = "proto2";
package google.protobuf.compiler;

message FileDescriptorProto {
  optional string name = 1;
  optional string package = 2;
  repeated DescriptorProto message_type = 3;
  repeated ServiceDescriptorProto service = 6;
}

message DescriptorProto {
  optional string name = 1;
}

message MethodDescriptorProto {
  optional string name = 1;
  optional string input_type = 2;
  optional string output_type = 3;
}

message ServiceDescriptorProto {
  optional string name = 1;
  repeated MethodDescriptorProto method = 2;
}

message CodeGeneratorRequest {
  repeated string file_to_generate = 1;
  optional string parameter = 2;
  optional string language = 3;
  repeated FileDescriptorProto proto_file = 15;
}
