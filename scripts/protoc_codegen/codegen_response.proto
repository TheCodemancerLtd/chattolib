// Vendored CodeGeneratorResponse (google/protobuf/compiler/codegen_response.proto).
// Field numbers match the canonical protoc plugin.proto so `protoc` accepts the
// response. `supported_features` (bit 0 = FEATURE_PROTO3_OPTIONAL) is what
// tells a recent protoc that this plugin can handle proto3 `optional` fields.
syntax = "proto2";
package google.protobuf.compiler;

message CodeGeneratorResponse {
  optional string error = 1;
  optional uint64 supported_features = 2;

  enum Feature {
    FEATURE_NONE = 0;
    FEATURE_PROTO3_OPTIONAL = 1;
    FEATURE_SUPPORTS_EDITIONS = 2;
  }

  message File {
    optional string name = 1;
    optional string insertion_point = 2;
    optional string content = 15;
  }
  repeated File file = 15;
}
